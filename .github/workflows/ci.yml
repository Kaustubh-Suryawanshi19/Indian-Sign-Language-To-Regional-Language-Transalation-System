name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests & validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python sources
        run: python -m compileall -q src tests web_app app.py scripts/dataset_creation.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Verify required project assets
        run: |
          test -f models/isl_yolov8m.pt
          test -f requirements.txt
          test -f requirements-web.txt
          test -f .env.example
          test -f LICENSE
          test -f README.md
          test -f web_app/app.py
          test -f web_app/templates/index.html
          test -f scripts/dataset_creation.py
          test -f training/notebooks/model_training_v12.ipynb
          test -f training/notebooks/sign_lang_yolov8.ipynb
          test -f assets/fonts/NotoSansDevanagari-Regular.ttf
